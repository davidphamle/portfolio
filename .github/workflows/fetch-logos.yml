name: Fetch company logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - logos/sources.json
      - scripts/fetch-logos.mjs
      - .github/workflows/fetch-logos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download logos
        run: node scripts/fetch-logos.mjs
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add logos
          if git diff --cached --quiet; then echo "No logo changes"; else
            git commit -m "Add company logos from official sites"
            git push
          fi
